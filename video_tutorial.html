<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Video Tutorial — Recorrido audiovisual por el portafolio digital y el video pitch de la metodología de investigación.">
    <title>Video Tutorial | Portafolio Digital</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="flipbook.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Londrina+Solid:wght@300;400;900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="assets/logo-unicaragena.svg" type="image/svg+xml">

    <style>
        /* ─── Page Specific Styles ─── */
        .vt-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(13, 17, 23, 0.55) 0%, rgba(13, 17, 23, 0.75) 100%),
                url('assets/video-tutorial/video-tutorial-background.jpeg') no-repeat center center;
            background-size: cover;
            z-index: -2;
        }

        .vt-back {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: #fff;
            text-decoration: none;
            font-family: var(--font-display, 'Londrina Solid', cursive);
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            border: 2px solid #fff;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .vt-back:hover {
            background: var(--highlight-yellow, #ffe066);
            color: var(--ink-dark);
            border-color: var(--ink-dark);
            box-shadow: 4px 4px 0 var(--ink-dark);
            transform: translateY(-2px);
        }

        .vt-main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 4rem;
            gap: 3rem;
        }

        .vt-header {
            text-align: center;
            color: #fff;
        }

        .vt-header h1 {
            font-family: var(--font-display, 'Londrina Solid', cursive);
            font-size: clamp(2.5rem, 6vw, 4rem);
            text-shadow: 3px 3px 0 var(--ink-dark, #2d2d44);
            margin-bottom: 0.5rem;
        }

        .vt-header p {
            font-family: var(--font-body, 'Source Sans Pro', sans-serif);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .vt-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
            width: 100%;
            max-width: 900px;
        }

        /* Customize the title for bright background */
        .referenciando-media-title.vt-title {
            font-size: 1.5rem;
            text-shadow: 2px 2px 0 var(--ink-dark);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <div class="vt-bg"></div>

    <a href="index.html#disenando" class="vt-back">
        <i class="fa-solid fa-arrow-left"></i> Volver
    </a>

    <main class="vt-main">
        <header class="vt-header reveal">
            <h1>Video Tutorial y Metodología</h1>
            <p>Explora el recorrido audiovisual por el portafolio digital y el video pitch de la metodología de
                investigación.</p>
        </header>

        <div class="vt-cards">
            <!-- CARD 1: Video Tutorial -->
            <div class="video-thumbnail-trigger reveal" id="vt-tour-trigger" data-modal="vt-modal-tour" tabindex="0"
                role="button" aria-label="Abrir Video Tutorial">
                <h3 class="referenciando-media-title vt-title">Video Tutorial del Portafolio</h3>
                <div class="video-thumb-container">
                    <img src="assets/video-tutorial/video-tutorial-thumbnail.png" alt="Video Tutorial">
                    <span class="video-clapper-badge" aria-hidden="true">
                        <i class="fa-solid fa-clapperboard"></i>
                    </span>
                    <span class="play-overlay" aria-hidden="true">
                        <i class="fa-solid fa-play"></i>
                    </span>
                </div>
                <p class="referenciando-media-hint" style="color:#fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.6);">
                    <i class="fa-solid fa-circle-play"></i> Haz clic para reproducir
                </p>
            </div>

            <!-- CARD 2: Video Pitch -->
            <div class="video-thumbnail-trigger reveal" id="vt-pitch-trigger" data-modal="vt-modal-pitch" tabindex="0"
                role="button" aria-label="Abrir Video Pitch">
                <h3 class="referenciando-media-title vt-title">Video Pitch — Metodología</h3>
                <div class="video-thumb-container">
                    <img src="assets/video-tutorial/video-methodology-thumbnail.jpeg" alt="Video Pitch Metodología">
                    <span class="video-clapper-badge" aria-hidden="true">
                        <i class="fa-solid fa-clapperboard"></i>
                    </span>
                    <span class="play-overlay" aria-hidden="true">
                        <i class="fa-solid fa-play"></i>
                    </span>
                </div>
                <p class="referenciando-media-hint" style="color:#fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.6);">
                    <i class="fa-solid fa-circle-play"></i> Haz clic para reproducir
                </p>
            </div>
        </div>
    </main>

    <!-- ─── Video Modals (matching referenciando style) ─── -->

    <!-- Modal 1: Tour -->
    <div class="video-modal" id="vt-modal-tour" role="dialog" aria-modal="true" aria-labelledby="vt-tour-title">
        <div class="video-modal-content">
            <button class="close-video-modal" aria-label="Cerrar video" onclick="closeVtModal('vt-modal-tour')">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="video-iframe-container">
                <!-- Lazy load YouTube frame -->
                <iframe data-src="https://www.youtube.com/embed/dhU-gljQUbY?si=VYKlncr3RVEFy6sW&autoplay=1"
                    title="Video Tutorial"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <!-- Modal 2: Pitch -->
    <div class="video-modal" id="vt-modal-pitch" role="dialog" aria-modal="true" aria-labelledby="vt-pitch-title">
        <div class="video-modal-content">
            <button class="close-video-modal" aria-label="Cerrar video" onclick="closeVtModal('vt-modal-pitch')">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="video-iframe-container">
                <!-- Iframe injected -->
                <iframe data-src="https://www.youtube.com/embed/qQ1watZAotw?si=SsWicvaw2AMUUZji&autoplay=1"
                    title="Video Pitch"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen style="display:none;">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        // Reveal script
        const reveals = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        reveals.forEach(el => { el.style.opacity = 0; el.style.transform = "translateY(30px)"; el.style.transition = "all 0.5s ease-out"; observer.observe(el); });
        document.querySelectorAll('.reveal.visible').forEach(el => { el.style.opacity = 1; el.style.transform = "translateY(0)"; });

        // Manual reveal apply to workaround inline style
        const styleTag = document.createElement("style");
        styleTag.innerHTML = ".reveal.visible { opacity: 1 !important; transform: translateY(0) !important; }";
        document.head.appendChild(styleTag);

        // Modal logic
        const triggers = document.querySelectorAll('.video-thumbnail-trigger');
        const modals = document.querySelectorAll('.video-modal');

        // Open Modal
        triggers.forEach(trigger => {
            trigger.addEventListener('click', () => {
                const modalId = trigger.getAttribute('data-modal');
                const modal = document.getElementById(modalId);
                if (!modal) return;

                const iframe = modal.querySelector('iframe');
                if (iframe && iframe.dataset.src && iframe.dataset.src !== "") {
                    iframe.src = iframe.dataset.src;
                    iframe.style.display = "block";
                }

                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            });

            // Accessibility: enter key
            trigger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    trigger.click();
                }
            });
        });

        // Close Modal func
        window.closeVtModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;

            modal.classList.remove('show');
            document.body.style.overflow = '';

            // Stop video playing by wiping src
            const iframe = modal.querySelector('iframe');
            if (iframe) {
                iframe.src = '';
                iframe.style.display = "none";
            }
        };

        // Close on background click
        modals.forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeVtModal(modal.id);
                }
            });
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const activeModal = document.querySelector('.video-modal.show');
                if (activeModal) {
                    closeVtModal(activeModal.id);
                }
            }
        });

    </script>
</body>

</html>
